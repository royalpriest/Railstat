{# Shared look: Space Mono, light/dark tokens, and the theme switcher. Included in <head>. #}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script>
  // Apply the saved theme before first paint so there's no flash. No saved choice = follow the system.
  (function () {
    try {
      var saved = localStorage.getItem("railstat-theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch (e) {}
  })();
</script>
<style>
:root {
  color-scheme: light;
  --font: "Space Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --page: #f4f4f1; --surface: #ffffff; --ink: #0b0b0b; --ink-2: #4a4945; --muted: #63625d;
  --line: #e1e0d9; --axis: #c3c2b7; --head: #f4f4f1; --chip: #e9e8e3;
  --series-1: #2a78d6; --series-2: #eb6834; --series-2-soft: #f4b393;
  --good: #006300; --good-fill: #0ca30c; --bad: #b42318;
  --warn-bg: #fff7e3; --warn-line: #f0d48a; --warn-ink: #4a3000;
  --error-bg: #fdeceb; --error-line: #b42318; --error-ink: #7a1c1a;
  --accent-bg: #eef5fd; --accent-ink: #104281; --focus: #2a78d6;
  --shadow: 0 18px 40px rgba(11, 11, 11, 0.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a3a29b;
    --line: #2c2c2a; --axis: #4a4a46; --head: #222220; --chip: #2c2c2a;
    --series-1: #3987e5; --series-2: #d95926; --series-2-soft: #7a3a20;
    --good: #3fbf3f; --good-fill: #0ca30c; --bad: #f08a80;
    --warn-bg: #2b2210; --warn-line: #6b5420; --warn-ink: #f5dfa8;
    --error-bg: #2d1514; --error-line: #f08a80; --error-ink: #f5c2bf;
    --accent-bg: #14243a; --accent-ink: #a9cdf6; --focus: #6da7ec;
    --shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a3a29b;
  --line: #2c2c2a; --axis: #4a4a46; --head: #222220; --chip: #2c2c2a;
  --series-1: #3987e5; --series-2: #d95926; --series-2-soft: #7a3a20;
  --good: #3fbf3f; --good-fill: #0ca30c; --bad: #f08a80;
  --warn-bg: #2b2210; --warn-line: #6b5420; --warn-ink: #f5dfa8;
  --error-bg: #2d1514; --error-line: #f08a80; --error-ink: #f5c2bf;
  --accent-bg: #14243a; --accent-ink: #a9cdf6; --focus: #6da7ec;
  --shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
}
.theme-toggle { min-height: 40px; min-width: 40px; padding: 0 12px; border: 1px solid var(--axis); border-radius: 8px;
  background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; }
.theme-toggle .moon { display: none; }
:root[data-theme="dark"] .theme-toggle .sun { display: none; }
:root[data-theme="dark"] .theme-toggle .moon { display: inline; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme-toggle .sun { display: none; }
  :root:not([data-theme="light"]) .theme-toggle .moon { display: inline; }
}
@media print { .theme-toggle { display: none; } }
</style>
